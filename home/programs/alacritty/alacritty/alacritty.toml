# ╭──────────────────────────────────────────────────────────────────────────╮
# │                              Alacritty                                   │
# │                      Pitch Black • Noir & Sapphire                       │
# ╰──────────────────────────────────────────────────────────────────────────╯

[general]
live_config_reload = true
import = []

# ── Window ───────────────────────────────────────────────────────────────────
[window]
decorations = "Buttonless"
dynamic_padding = true
startup_mode = "Windowed"
title = "Terminal"
dynamic_title = true
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 140
lines = 40

[window.padding]
x = 12
y = 10

# ── Font ─────────────────────────────────────────────────────────────────────
[font]
size = 13.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

# ── Cursor ───────────────────────────────────────────────────────────────────
[cursor]
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true
vi_mode_style = "Block"

[cursor.style]
shape = "Block"
blinking = "On"

# ── Scrolling ────────────────────────────────────────────────────────────────
[scrolling]
history = 10000
multiplier = 3

# ── Selection ────────────────────────────────────────────────────────────────
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# ── Bell ─────────────────────────────────────────────────────────────────────
[bell]
animation = "EaseOutExpo"
color = "#0A3D91"
duration = 100

# ── Terminal ─────────────────────────────────────────────────────────────────
[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "/run/current-system/sw/bin/zsh"

# ── Mouse ────────────────────────────────────────────────────────────────────
[mouse]
hide_when_typing = true

# ── Hints ────────────────────────────────────────────────────────────────────
[hints]
enabled = [
  { binding = { key = "U", mods = "Control|Shift" }, command = "open", hyperlinks = true, post_processing = true, persist = false, mouse = { enabled = true, mods = "None" }, regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+" }
]

# ══════════════════════════════════════════════════════════════════════════════
# COLORS - Noir & Sapphire
# ══════════════════════════════════════════════════════════════════════════════

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"
foreground = "#F2EFE6"
dim_foreground = "#B8B2A3"
bright_foreground = "#F5C542"

[colors.cursor]
cursor = "#D4A017"
text = "#000000"

[colors.vi_mode_cursor]
cursor = "#0A3D91"
text = "#F2EFE6"

[colors.search.matches]
background = "#0A3D91"
foreground = "#F2EFE6"

[colors.search.focused_match]
background = "#B8790A"
foreground = "#000000"

[colors.hints.start]
background = "#D4A017"
foreground = "#000000"

[colors.hints.end]
background = "#2A2822"
foreground = "#F2EFE6"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
background = "#0D0D0D"
foreground = "#F2EFE6"

[colors.selection]
background = "#072A66"
text = "#F2EFE6"

# Normal colors
[colors.normal]
black = "#0D0D0D"
red = "#E22F4D"
green = "#16A362"
yellow = "#E69A0A"
blue = "#0A3D91"
magenta = "#8A6A1E"
cyan = "#3E8FE0"
white = "#B8B2A3"

# Bright colors
[colors.bright]
black = "#4A4433"
red = "#E22F4D"
green = "#16A362"
yellow = "#F5C542"
blue = "#3E8FE0"
magenta = "#D4A017"
cyan = "#6FB4F0"
white = "#F2EFE6"

# Dim colors
[colors.dim]
black = "#161513"
red = "#A3122E"
green = "#0E7A47"
yellow = "#B8790A"
blue = "#072A66"
magenta = "#5C4413"
cyan = "#2A6BB0"
white = "#726C5E"

# ══════════════════════════════════════════════════════════════════════════════
# KEYBOARD BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

[keyboard]
bindings = [
  # Window management
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Return", mods = "Control|Shift", action = "ToggleFullscreen" },
  
  # Font size
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
  
  # Clipboard
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  
  # Scrolling
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", action = "ScrollToTop" },
  { key = "End", mods = "Shift", action = "ScrollToBottom" },
  
  # Vi mode
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  
  # Search
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },
]
